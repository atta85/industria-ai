# Industria-AI look and feel ("Industrial Slate").
# Light is the default. Users can switch to dark from the app menu
# (three dots, top right) > Settings.

[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#CBD5E1"

[theme.light.sidebar]
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#6366F1"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111827"
textColor = "#E5E7EB"
borderColor = "#273449"

[theme.dark.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#111827"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 5
